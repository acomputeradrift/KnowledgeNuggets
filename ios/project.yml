name: KnowledgeNuggets
options:
  bundleIdPrefix: com.acomputeradrift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple team used to sign for a device.
    DEVELOPMENT_TEAM: W7K9Q4Z2Y3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_MODULE_VERIFIER: NO
targets:
  KnowledgeNuggets:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeNuggets
    info:
      path: KnowledgeNuggets/Info.plist
      properties:
        CFBundleDisplayName: Knowledge Nuggets
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.acomputeradrift.KnowledgeNuggets.refresh
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acomputeradrift.KnowledgeNuggets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"KnowledgeNuggets/Preview Content\""
  KnowledgeNuggetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnowledgeNuggetsTests
    dependencies:
      - target: KnowledgeNuggets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acomputeradrift.KnowledgeNuggetsTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  KnowledgeNuggets:
    build:
      targets:
        KnowledgeNuggets: all
        KnowledgeNuggetsTests: [test]
    test:
      targets:
        - KnowledgeNuggetsTests
      gatherCoverageData: true
    run:
      config: Debug
