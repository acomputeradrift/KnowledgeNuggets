name: KnowledgeNuggets
options:
  bundleIdPrefix: com.acomputeradrift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple team used to sign for a device.
    DEVELOPMENT_TEAM: W7K9Q4Z2Y3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_MODULE_VERIFIER: NO
targets:
  KnowledgeNuggets:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeNuggets
    info:
      path: KnowledgeNuggets/Info.plist
      properties:
        CFBundleDisplayName: Knowledge Nuggets
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.acomputeradrift.KnowledgeNuggets.refresh
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acomputeradrift.KnowledgeNuggets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"KnowledgeNuggets/Preview Content\""
        # The build-stamp script reads git and writes into the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp build commit and time
        basedOnDependencyAnalysis: false
        # Declared so it always runs after Xcode writes the Info.plist.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Shown in Settings so you can tell which build is on the phone.
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          COMMIT=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          if ! git -C "${SRCROOT}" diff --quiet HEAD -- 2>/dev/null; then COMMIT="${COMMIT}+changes"; fi
          STAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          /usr/libexec/PlistBuddy -c "Delete :KNBuildCommit" "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Delete :KNBuildDate" "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :KNBuildCommit string ${COMMIT}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :KNBuildDate string ${STAMP}" "$PLIST"
  KnowledgeNuggetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnowledgeNuggetsTests
    dependencies:
      - target: KnowledgeNuggets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acomputeradrift.KnowledgeNuggetsTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  KnowledgeNuggets:
    build:
      targets:
        KnowledgeNuggets: all
        KnowledgeNuggetsTests: [test]
    test:
      targets:
        - KnowledgeNuggetsTests
      gatherCoverageData: true
    run:
      config: Debug
